name: Actualizar datos de vehículos

on:
  workflow_dispatch:
  schedule:
    # Día 3 de cada mes a las 00:00 de Argentina (03:00 UTC).
    - cron: "0 3 3 * *"

concurrency:
  group: actualizar-autos
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 140

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Ejecutar lote
        env:
          JOB_SECONDS: "7500"
          REQUEST_INTERVAL_MS: "21000"
          CHECKPOINT_EVERY: "25"
        run: |
          node scripts/generar-autos-data.js

      - name: Commit datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add autos-data.json
          git add estado-actualizacion.json
          git add data/

          if git diff --cached --quiet; then
            echo "No hay cambios."
          else
            git commit -m "Actualizar datos de vehículos"
            git push
          fi

      - name: Continuar siguiente lote
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMPLETE=$(node -p "JSON.parse(require('fs').readFileSync('estado-actualizacion.json','utf8')).completo")

          INDEX=$(node -p "JSON.parse(require('fs').readFileSync('estado-actualizacion.json','utf8')).siguienteIndice")

          TOTAL=$(node -p "JSON.parse(require('fs').readFileSync('estado-actualizacion.json','utf8')).totalVersionesCatalogadas")

          echo "Progreso: $INDEX/$TOTAL"

          if [ "$COMPLETE" != "true" ]; then
            gh workflow run actualizar-autos.yml --ref main
          else
            echo "Actualización completa."
          fi
