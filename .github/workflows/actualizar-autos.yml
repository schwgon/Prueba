name: Actualizar datos de vehículos
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Procesar lote
        run: node scripts/generar-autos-data.js
        env:
          BATCH_MINUTES: 315
      - name: Guardar progreso y datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add autos-data.json autos-progress.json
          if git diff --cached --quiet; then echo "No hay cambios."; else git commit -m "Actualizar catálogo de vehículos"; git push; fi
